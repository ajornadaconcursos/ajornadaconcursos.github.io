# Publica o site no Cloudflare Pages (ajornadaconcursos.pages.dev) a cada mudança no main.
# Precisa de dois segredos no repositório: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Publicar no Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Separar só os arquivos do site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='supabase' --exclude='*.sql' --exclude='*.ts' ./ _site/
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=ajornadaconcursos --branch=main --commit-dirty=true
